<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Base Circle White -->
  <circle cx="140" cy="140" r="130" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Red Outer Border -->
  <circle cx="140" cy="140" r="118" fill="none" stroke="#DC2626" stroke-width="24"/>

  <!-- Black U-Turn Arrow -->
  <g fill="none" stroke="#1F2937" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Straight right leg going up, looping over to the left, pointing down -->
    <path d="M 175 190 L 175 125 A 35 35 0 0 0 105 125 L 105 170" />
  </g>
  <!-- Arrow Head pointing down on left leg -->
  <polygon points="105,200 80,160 130,160" fill="#1F2937"/>

  <!-- Red Diagonal Slash (from top-left to bottom-right) -->
  <line x1="56" y1="56" x2="224" y2="224" stroke="#DC2626" stroke-width="22" stroke-linecap="round"/>
</svg>
