<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Base Circle White -->
  <circle cx="140" cy="140" r="130" fill="#FFFFFF" filter="url(#shadow)"/>
  <!-- Red Outer Border -->
  <circle cx="140" cy="140" r="118" fill="none" stroke="#DC2626" stroke-width="24"/>

  <!-- Letter P in Black -->
  <text x="140" y="180"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="130"
        font-weight="900"
        fill="#1F2937"
        text-anchor="middle">P</text>

  <!-- Red Diagonal Slash (from top-left to bottom-right) -->
  <line x1="56" y1="56" x2="224" y2="224" stroke="#DC2626" stroke-width="22" stroke-linecap="round"/>
</svg>