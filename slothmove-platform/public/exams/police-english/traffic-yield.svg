<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <!-- Outer Red Border with Rounded Corners -->
  <polygon points="160,265 15,20 305,20"
           fill="#DC2626"
           stroke="#B91C1C"
           stroke-width="4"
           stroke-linejoin="round"
           filter="url(#shadow)"/>
  <!-- Inner White Triangle -->
  <polygon points="160,205 55,40 265,40"
           fill="#FFFFFF"
           stroke="#DC2626"
           stroke-width="2"
           stroke-linejoin="round"/>
  <!-- YIELD Text -->
  <text x="160" y="105"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="34"
        font-weight="900"
        fill="#DC2626"
        text-anchor="middle"
        letter-spacing="2">YIELD</text>
</svg>