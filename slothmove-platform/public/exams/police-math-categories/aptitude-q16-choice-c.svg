<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 150" width="240" height="150">
  <rect x="2" y="2" width="236" height="146" rx="14" fill="#ffffff" stroke="#d8dee8" stroke-width="3"/>
  <style>
    .line { fill:none; stroke:#172554; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .thin { fill:none; stroke:#94a3b8; stroke-width:2; }
    .dash { fill:none; stroke:#cbd5e1; stroke-width:2; stroke-dasharray:4 4; }
    .accent { fill:none; stroke:#be123c; stroke-width:5; stroke-linecap:round; stroke-linejoin:round; }
    .fill-accent { fill:#be123c; }
    .shape { fill:#e0f2fe; stroke:#172554; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
    .tile { fill:#f0f9ff; stroke:#0284c7; stroke-width:4; rx:8; }
    .lbl { font:bold 36px Arial,sans-serif; fill:#0369a1; text-anchor:middle; dominant-baseline:central; }
    .dir { font:bold 14px Arial,sans-serif; fill:#64748b; text-anchor:middle; dominant-baseline:central; }
  </style>
  
  <g>
    <circle class="shape" cx="120" cy="75" r="42"/>
  </g>
</svg>